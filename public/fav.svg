<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">

  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ff7a18"/>
      <stop offset="100%" stop-color="#ff4d00"/>
    </linearGradient>
  </defs>

  <!-- Pot body (maximized) -->
  <rect x="4" y="28" width="56" height="24" rx="12"
        fill="url(#g)" stroke="black" stroke-width="2.5"/>

  <!-- Lid -->
  <rect x="8" y="14" width="48" height="14" rx="7"
        fill="#ff7a18" stroke="black" stroke-width="2.5"/>

  <!-- Knob -->
  <circle cx="32" cy="12" r="4.5"
          fill="#ffb347" stroke="black" stroke-width="2"/>

  <!-- Steam (minimal + bold) -->
  <path d="M26 12 C24 8, 32 8, 30 4"
        stroke="black" stroke-width="3" stroke-linecap="round" fill="none"/>

  <path d="M38 12 C36 8, 44 8, 42 4"
        stroke="black" stroke-width="3" stroke-linecap="round" fill="none"/>

</svg>
